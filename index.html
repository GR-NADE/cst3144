<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Checker</title>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id = "app">
        <p v-if = "age <= 13">You are a child</p>
        <p v-else-if = "age <= 18">You are a teenager</p>
        <p v-else-if = "age > 18">You are an adult</p>
        
        <script>
            const app = Vue.createApp({
                data() {
                    return {
                        age: 20
                    }
                }
            })

            app.mount('#app')
        </script>
    </div>
</body>
</html>

<!-- This is a simple age checker built with Vue.js. It takes a person's age and uses Vue's conditional rendering to determine ehat category they fall into. So if the age is 13 or below, it displays child. If it's between 14 and 18, it displays teenager. And if it's above 18, it displays adult. -->
